dv4dbt_fabricspark:
  target: dev
  outputs:
    dev:
      type: fabricspark
      method: livy
      authentication: CLI
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      lakehouseid: "{{ env_var('FABRIC_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_LAKEHOUSE_NAME') }}"
      # Schema-enabled lakehouse: schema must differ from lakehouse name
      schema: dv_test
      threads: 1
      reuse_session: true
      high_concurrency: true
      retry_all: true
      connect_retries: 3
      connect_timeout: 10
      spark_config:
        name: dv4dbt-fabricspark-test
    multi:
      type: fabricspark
      method: livy
      authentication: CLI
      endpoint: https://api.fabric.microsoft.com/v1
      workspaceid: "{{ env_var('FABRIC_WORKSPACE_ID') }}"
      lakehouseid: "{{ env_var('FABRIC_SILVER_LAKEHOUSE_ID') }}"
      lakehouse: "{{ env_var('FABRIC_SILVER_LAKEHOUSE_NAME') }}"
      schema: dv_stage
      threads: 1
      reuse_session: true
      high_concurrency: false
      retry_all: true
      connect_retries: 3
      connect_timeout: 10
      spark_config:
        name: dv4dbt-fabricspark-multi
