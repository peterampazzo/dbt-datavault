version: 2

seeds:
  - name: nation
    config:
      column_types:
        n_nationkey: int
        n_name: string
        n_regionkey: int
        n_comment: string
        ldts: timestamp
        rsrc: string
  - name: customer
    config:
      column_types:
        c_custkey: int
        c_name: string
        c_address: string
        c_nationkey: int
        c_phone: string
        c_acctbal: decimal(12,2)
        c_mktsegment: string
        c_comment: string
        ldts: timestamp
        rsrc: string
  - name: orders
    config:
      column_types:
        o_orderkey: int
        o_custkey: int
        o_orderstatus: string
        o_totalprice: decimal(12,2)
        o_orderdate: date
        o_orderpriority: string
        o_clerk: string
        o_shippriority: int
        o_comment: string
        ldts: timestamp
        rsrc: string
  - name: customer_phone
    config:
      column_types:
        c_custkey: int
        phone_type: string
        phone_number: string
        ldts: timestamp
        rsrc: string
  - name: ref_currency
    config:
      column_types:
        cur_code: string
        cur_name: string
        decimals: int
        ldts: timestamp
        rsrc: string
  - name: lineitem
    config:
      column_types:
        l_orderkey: int
        l_linenumber: int
        l_partkey: string
        l_quantity: int
        l_extendedprice: decimal(12,2)
        l_seq: int
        ldts: timestamp
        rsrc: string
  - name: orders_feed2
    config:
      column_types:
        o_orderkey: int
        o_custkey: int
        o_orderstatus: string
        o_totalprice: decimal(12,2)
        o_orderdate: date
        o_orderpriority: string
        o_clerk: string
        o_shippriority: int
        o_comment: string
        ldts: timestamp
        rsrc: string
